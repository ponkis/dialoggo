name: Release

# Production releases are cut from version tags on main:
#   npm run promote:release   (merges dev into main, tags vX.Y.Z, pushes)
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark the GitHub release as a prerelease."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  DIALOGGO_ENV: production

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        id: version
        env:
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          version="$(node -p "require('./package.json').version")"

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::package.json version '$version' is not valid semver."
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
              exit 1
            fi

            git fetch origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Release tags must point at a commit on main."
              exit 1
            fi
          elif [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "::error::Manual releases must be started from main."
            exit 1
          fi

          prerelease=false
          if [[ "$version" == *-* || "$INPUT_PRERELEASE" == "true" ]]; then
            prerelease=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

  package:
    name: Package (${{ matrix.os }})
    needs: [prepare, verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Package production build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dialoggo-${{ needs.prepare.outputs.version }}-${{ runner.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: dialoggo-${{ needs.prepare.outputs.version }}-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: |
          sha256sum -- * | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          args=(release create "$TAG" artifacts/* --title "Dialoggo $VERSION" --generate-notes --target "$GITHUB_SHA")
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
